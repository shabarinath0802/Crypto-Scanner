name: 15m RSI Extreme Scanner

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes -- the fastest GitHub Actions allows
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can save its "already alerted" memory

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 15m RSI scanner
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python rsi_15m_scanner.py

      - name: Save memory back to repo
        run: |
          git config user.name "rsi-15m-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rsi_15m_state.json
          git diff --staged --quiet || git commit -m "Update 15m RSI alert memory"
          git push
