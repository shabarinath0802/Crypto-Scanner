name: RSI Overbought Scanner

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes -- the fastest GitHub Actions allows
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can save its "already alerted" memory

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI scanner
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python rsi_scanner.py

     - name: Save memory back to repo
        run: |
          git config user.name "rsi-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rsi_state.json
          git diff --staged --quiet || git commit -m "Update RSI alert memory"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push conflict, retrying ($i)..."
            sleep 5
          done
